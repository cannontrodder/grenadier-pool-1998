name: Publish practice preview

on:
  push:
    branches: [main]
    paths:
      - 'practice/**'
      - 'scripts/practice/**'
      - 'scripts/build-practice-preview.py'
      - 'docs/design/favicon.svg'
      - '.github/workflows/practice-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: practice-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - name: Check model and accepted input
        run: node --test scripts/practice/*.test.mjs
      - name: Build public runtime
        run: python3 scripts/build-practice-preview.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: out-public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy practice preview
        id: deployment
        uses: actions/deploy-pages@v4
