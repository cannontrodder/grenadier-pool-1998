<title id="title">Grenadier pub layout — interpretation of the user's description</title><desc id="desc">A schematic top-down plan. The bar occupies the middle third of the bottom back wall, with its full length still uncertain. One pool table sits to the left. Seats and tables lie beyond it and on the right side. The foyer and entrance are immediately above the bar, with toilets to either side. Betty is identified at the bar as a character placeholder. No measurements or finished 3D model are implied.</desc>
